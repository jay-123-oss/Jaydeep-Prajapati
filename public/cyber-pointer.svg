<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <g>
    <!-- Magenta Glitch Offset Hand -->
    <g fill="#FF007F" opacity="0.95" transform="translate(-2, -1)">
      <rect x="12" y="1" width="5" height="15" />
      <rect x="7" y="10" width="16" height="15" />
      <rect x="4" y="15" width="5" height="8" />
    </g>
    <rect x="2" y="12" width="7" height="2" fill="#FF007F"/>
    <rect x="20" y="2" width="6" height="2" fill="#FF007F"/>

    <!-- Cyan Glitch Offset Hand -->
    <g fill="#00F0FF" opacity="0.95" transform="translate(2, 1)">
      <rect x="12" y="1" width="5" height="15" />
      <rect x="7" y="10" width="16" height="15" />
      <rect x="4" y="15" width="5" height="8" />
    </g>
    <rect x="23" y="18" width="7" height="2" fill="#00F0FF"/>
    <rect x="5" y="26" width="8" height="2" fill="#00F0FF"/>

    <!-- Main Solid Black Hand Pointer -->
    <g fill="#000000" stroke="#FFFFFF" stroke-width="0.75">
      <!-- Index Finger -->
      <rect x="12" y="2" width="5" height="14" rx="1"/>
      <!-- Palm & Other Fingers -->
      <path d="M 7,12 L 23,12 L 23,24 C 23,26 21,28 18,28 L 10,28 C 7,28 7,26 7,24 Z" />
      <!-- Thumb -->
      <path d="M 4,16 L 8,13 L 10,17 L 6,20 Z" />
    </g>
  </g>
</svg>
